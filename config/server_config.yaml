server:
  host: "0.0.0.0"
  port: 8443
  ssl_enabled: false
  ssl_cert: null
  ssl_key: null
  
logging:
  level: "INFO"
  file: "logs/server.log"
  max_size: "10MB"
  backup_count: 5
  
security:
  api_key: "redsignal-demo-key-2024"
  session_timeout: 3600
  max_clients: 50
  
features:
  web_interface: true
  command_history: true
  client_persistence: true
